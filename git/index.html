<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Components</title>
    </head>

    <body>
        
        <div class="diagonal-button">
            <button class="round-button music-button">
            </button>
        </div>

        <div class="diagonal-button">
            <button class="round-button profile-button">
            </button>
        </div>

        <div class="tile">
        </div>

        <section class="login-form">
            <div class="login-tab">
                <label class="form-label" for="email">Your email </label><br>
                <input class="form-input" type="email" id="email" name="email"><br>

                <label class="form-label" for="password">Your password </label><br>
                <input class="form-input" type="password" id="password" name="password"><br>

                <button class="login-button">Log in</button>

                <p class="form-para">Forget your password?</p>
            </div>
            <div>
                <button class="create-acc-button">Create account</button>
            </div>
        </section>

    </body>

</html>
