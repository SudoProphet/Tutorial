<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>

    <form>

        <fieldset>

            <legend align="center"><h3>Details</h3></legend>

            <p>
                <label for="firstname">First Name :</label>
                <input type="text" id="firstname" name="firstname" placeholder="Jane" autocomplete="on" autofocus><br>
            </p>

            <p>
                <label for="lastname">Last Name :</label>
                <input type="text" id="lastname" name="lastname" placeholder="Doe" autocomplete="on"><br>
            </p>

            <p>
                <label for="age">Age :</label>
                <input type="number" id=""age name="age" pattern="[0-9]" placeholder="25"><br>
            </p>

            <p>
                <label for="mobile">Mobile :</label>
                <input type="tel" id=""mobile name="mobile" pattern="[0-9]" placeholder="9876543210"><br>
            </p>

            <p>
                Address :<br>
                <textarea rows="2" cols="20"></textarea><br>
            </p>

        </fieldset>

    </form>
    
</body>
</html>
